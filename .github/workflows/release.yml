name: Release

# Push a tag such as v1.0.1 after updating the version in 99trace-posthog-for-woocommerce/99trace-posthog-for-woocommerce.php, W99_TRACE_VERSION,
# readme.txt (Stable tag and changelog) and CHANGELOG.md. The zip is attached to a GitHub release, and,
# once the repository variable WPORG_DEPLOY is "true" and the SVN_USERNAME / SVN_PASSWORD secrets are set,
# the same files are committed to the WordPress.org plugin directory.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches the plugin version
        run: |
          version=$(sed -n 's/^ \* Version: *//p' 99trace-posthog-for-woocommerce/99trace-posthog-for-woocommerce.php | tr -d ' \r')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match the plugin version $version"; exit 1; }

      - name: Build the zip
        run: bin/build-zip.sh

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v " " { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md > notes.md
          test -s notes.md || echo "99Trace $version" > notes.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "99Trace ${GITHUB_REF_NAME#v}" --notes-file notes.md

      - name: WordPress.org
        if: ${{ vars.WPORG_DEPLOY == 'true' }}
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: 99trace-posthog-for-woocommerce
          BUILD_DIR: 99trace-posthog-for-woocommerce
          ASSETS_DIR: .wordpress-org
