name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax
        run: find 99trace-integration-with-posthog-for-woocommerce -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: php tests/unit/run.php

  browser-module:
    name: Browser module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit tests
        run: for t in hold visitor shown scrub team; do node "tests/unit/$t.mjs"; done

  wordpress:
    name: WordPress and WooCommerce (Playground)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Server-side checks on the latest WordPress and WooCommerce
        run: tests/run.sh

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: WordPress/plugin-check-action@v1
        with:
          build-dir: './99trace-integration-with-posthog-for-woocommerce'
          slug: '99trace-integration-with-posthog-for-woocommerce'

  build:
    name: Build the zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bin/build-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: 99trace
          path: dist/*.zip
